
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Horizontal Crossword</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
    }
    .crossword {
      display: grid;
      gap: 8px;
      max-width: 500px;
      margin-bottom: 20px;
    }
    .word {
      display: flex;
      gap: 2px;
    }
    .cell {
      width: 40px;
      height: 40px;
      border: 2px solid #333;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      text-transform: uppercase;
      background-color: white;
    }
    .clues h3 {
      margin-top: 30px;
    }
    .clue {
      margin: 8px 0;
    }
  </style>
</head>
<body>

  <h2>Horizontal Crossword (Fill in the blanks)</h2>

  <div class="crossword" id="crossword"></div>

  <div class="clues">
    <h3>Clues:</h3>
    <div class="clue">1. A red or green fruit</div>
    <div class="clue">2. A big striped cat</div>
    <div class="clue">3. What you listen to with headphones</div>
    <div class="clue">4. Very large body of salt water</div>
    <div class="clue">5. What makes things visible in the dark</div>
  </div>

  <script>
    const words = ["APPLE", "TIGER", "MUSIC", "OCEAN", "LIGHT"];
    const crosswordEl = document.getElementById("crossword");

    words.forEach((word, index) => {
      const wordEl = document.createElement("div");
      wordEl.className = "word";
      word.split("").forEach(letter => {
        const cell = document.createElement("div");
        cell.className = "cell";
        // Оставляем пустыми для заполнения пользователем
        // cell.textContent = letter; // раскомментировать для решения
        wordEl.appendChild(cell);
      });
      crosswordEl.appendChild(wordEl);
    });
  </script>

</body>
</html>
